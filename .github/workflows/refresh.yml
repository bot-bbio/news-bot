name: Bi-daily briefing refresh

# Renders each user's hosted PWA digest and deploys it to Cloudflare Pages
# twice a day at ~6am and ~5pm America/New_York.
#
# GitHub Actions cron is UTC and DST-unaware, so we fire at all four candidate
# hours and gate on the actual New York hour. Exactly one entry of each pair runs
# per season (EDT: 10/21 UTC, EST: 11/22 UTC), so there are no double-deploys.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   - token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account id
#   CONFIG_FETCH_TOKEN     - (optional) bearer token to fetch private config URLs
#   USER1_CONFIG_URL       - URL (or path) to user 1's config.json
#   USER1_PAGES_PROJECT    - Cloudflare Pages project name for user 1
#   USER2_CONFIG_URL       - URL (or path) to user 2's config.json
#   USER2_PAGES_PROJECT    - Cloudflare Pages project name for user 2

on:
  schedule:
    - cron: "0 10,11,21,22 * * *"
  workflow_dispatch: {}   # allow manual runs (these bypass the time gate)

# Avoid overlapping deploys if a run is slow.
concurrency:
  group: briefing-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Gate to 6am / 5pm America/New_York
        id: gate
        run: |
          HOUR=$(TZ=America/New_York date +%H)
          echo "Current New York hour: $HOUR"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding regardless of time."
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ "$HOUR" = "06" ] || [ "$HOUR" = "17" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a target hour (need 06 or 17 ET) — skipping this run."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render and deploy each user's briefing
        if: steps.gate.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIG_FETCH_TOKEN: ${{ secrets.CONFIG_FETCH_TOKEN }}
          USER1_CONFIG_URL: ${{ secrets.USER1_CONFIG_URL }}
          USER1_PAGES_PROJECT: ${{ secrets.USER1_PAGES_PROJECT }}
          USER2_CONFIG_URL: ${{ secrets.USER2_CONFIG_URL }}
          USER2_PAGES_PROJECT: ${{ secrets.USER2_PAGES_PROJECT }}
        run: |
          set -euo pipefail

          deploy_user () {
            local cfg="$1"
            local project="$2"
            if [ -z "$cfg" ] || [ -z "$project" ]; then
              echo "::warning::Skipping a user — config URL or project name not set."
              return 0
            fi
            local out="dist/$project"
            echo "Rendering $project ..."
            # generate.py uses only the Python standard library — no pip install needed.
            python generate.py --mode=hosted --config "$cfg" --out "$out" --silent
            echo "Deploying $project to Cloudflare Pages ..."
            npx --yes wrangler@3 pages deploy "$out" \
              --project-name "$project" --branch main --commit-dirty=true
          }

          deploy_user "$USER1_CONFIG_URL" "$USER1_PAGES_PROJECT"
          deploy_user "$USER2_CONFIG_URL" "$USER2_PAGES_PROJECT"
